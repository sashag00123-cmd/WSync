name: build

# Запуск вручную из вкладки Actions либо по тегу вида v0.1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Проверки
        run: |
          npm run typecheck
          npm run smoke

      - name: Сборка установщика
        run: npm run dist:win
        env:
          # Ключи приложения Яндекс.OAuth вшиваются в сборку из секретов репозитория.
          WSYNC_YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          WSYNC_YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          WSYNC_YANDEX_SCOPE: ${{ secrets.YANDEX_SCOPE }}

      # latest.yml и blockmap нужны electron-updater: по первому приложение
      # узнаёт о новой версии, второй позволяет качать только изменившиеся блоки.
      - uses: actions/upload-artifact@v4
        with:
          name: WSync-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Проверки
        run: |
          npm run typecheck
          npm run smoke

      - name: Сборка образов дисков
        run: npm run dist:mac
        env:
          WSYNC_YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          WSYNC_YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          WSYNC_YANDEX_SCOPE: ${{ secrets.YANDEX_SCOPE }}
          # Подписи нет, и electron-builder не должен её искать: без этого
          # сборка падает на попытке найти сертификат в связке ключей.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: WSync-macos
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  # Артефакты задания живут 90 дней и требуют входа в GitHub. Для тега делаем
  # релиз: установщики становятся доступны по прямой ссылке.
  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Если релиз для тега уже есть — обновляем файлы, а не пытаемся создать
      # его заново: create на существующем теге падает, и это ровно тот случай,
      # когда тег передвинули и запустили сборку повторно.
      - name: Релиз с установщиками
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Релиз $TAG уже существует — заменяю файлы"
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "WSync $TAG" --generate-notes
          fi
